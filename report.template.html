<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Grain | BI Demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #142b31; background: #ecf2f0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 980px; padding: 3.2rem 1.2rem; margin: auto; }
    header { display: flex; justify-content: space-between; gap: 1.6rem; align-items: flex-end; margin-bottom: 1.8rem; }
    h1, h2 { margin: 0; line-height: 1.12; }
    h1 { font-size: clamp(2.1rem, 6vw, 3.65rem); letter-spacing: -.05em; }
    h2 { font-size: 1.2rem; }
    p { line-height: 1.55; margin: .75rem 0 0; }
    header p, .note { color: #405e62; }
    label { display: grid; gap: .45rem; font-weight: 650; min-width: 10rem; }
    select { font: inherit; font-weight: 500; background: white; color: inherit; padding: .6rem; border: 1px solid #788e8e; border-radius: .45rem; }
    .compare { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    article, .detail { border: 1px solid #c0d1cf; border-radius: .85rem; padding: 1.3rem; background: #fff; }
    .correct { background: #133e40; color: #fff; border-color: #133e40; }
    .rate { font-size: clamp(2.4rem, 7vw, 4.5rem); font-weight: 750; letter-spacing: -.04em; margin: .45rem 0 0; line-height: 1.1; }
    meter { width: 100%; height: 1rem; margin: .9rem 0 0; accent-color: #c17a3c; }
    .correct meter { accent-color: #a2dfcb; }
    meter::-webkit-meter-optimum-value { background: #a65524; }
    .correct meter::-webkit-meter-optimum-value { background: #a2dfcb; }
    .detail { margin: 1rem 0 0; }
    table { width: 100%; text-align: left; border-collapse: collapse; margin-top: .9rem; }
    th, td { padding: .65rem .4rem; border-bottom: 1px solid #d6e2df; }
    th { font-size: .87rem; }
    tr:last-child td { border-bottom: 0; }
    .missing { color: #674930; }
    @media (max-width: 620px) {
      main { padding-top: 1.8rem; }
      header { display: grid; }
      .compare { grid-template-columns: 1fr; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 420px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>How many orders arrived on time?</h1>
      <p>One fictional retailer, two ways to count, two very different answers.</p></div>
    <label>Customer region <select id="region" aria-label="Customer region"></select></label>
  </header>
  <section class="compare" aria-label="Comparison of delivery metrics" aria-live="polite">
    <article class="correct"><h2>Order-based rate</h2><p class="rate" id="order-rate"></p>
      <meter id="order-meter" min="0" max="1" aria-label="Order-based delivery rate"></meter><p id="order-count"></p></article>
    <article><h2>Item-weighted comparison</h2><p class="rate" id="line-rate"></p>
      <meter id="line-meter" min="0" max="1" aria-label="Item-weighted delivery rate"></meter><p id="line-count"></p></article>
  </section>
  <p class="note" id="explanation"></p>
  <section class="detail">
    <h2>Orders behind the numbers</h2>
    <p id="sales"></p>
    <div class="table-wrap"><table>
      <thead><tr><th scope="col">Order</th><th scope="col">Region</th><th scope="col">Item lines</th><th scope="col">Delivery</th></tr></thead>
      <tbody id="order-detail"></tbody>
    </table></div>
  </section>
  <noscript><p>Enable JavaScript to use the region filter. This report works offline.</p></noscript>
</main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
  const data = JSON.parse(document.getElementById('report-data').textContent);
  const filter = document.getElementById('region');
  const put = (id, value) => { document.getElementById(id).textContent = value; };
  const currency = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

  data.statistics.forEach((stats, index) => filter.add(new Option(stats.region, index)));

  function renderRate(prefix, count, total, unit) {
    const ratio = total ? count / total : null;
    put(`${prefix}-rate`, ratio === null ? '—' : `${(100 * ratio).toFixed(1)}%`);
    put(`${prefix}-count`, `${count} of ${total} eligible ${unit}`);
    const meter = document.getElementById(`${prefix}-meter`);
    meter.hidden = ratio === null;
    meter.value = ratio ?? 0;
  }

  function render() {
    const stats = data.statistics[Number(filter.value)];
    renderRate('order', stats.on_time_orders, stats.eligible_orders, 'orders');
    renderRate('line', stats.on_time_lines, stats.eligible_lines, 'item lines');
    put('explanation', `Item counting gives each order one vote per line. The order rate gives each eligible order one vote. Missing delivery dates excluded: ${stats.missing_dates}.`);
    put('sales', `${currency.format(stats.sales_cents / 100)} in merchandise value for delivered orders in this region.`);
    const body = document.getElementById('order-detail');
    body.replaceChildren();
    data.orders.filter(row => filter.value === '0' || row.region === stats.region).forEach(row => {
      const tr = body.insertRow();
      let delivery = row.on_time ? 'On time' : 'Late';
      if (row.on_time === null) delivery = row.status === 'delivered' ? 'Missing date' : 'Excluded';
      [row.order_id, row.region, row.item_lines, delivery].forEach(value => { tr.insertCell().textContent = value; });
      if (row.on_time === null) tr.lastElementChild.className = 'missing';
    });
  }

  filter.addEventListener('change', render);
  render();
</script>
</body>
</html>
